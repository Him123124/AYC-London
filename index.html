<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>AYC London</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1120;color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%);text-align:center;padding:clamp(28px,7vw,72px);border:1px solid #ffffff20;border-radius:24px;background:linear-gradient(145deg,#172033,#0e1422);box-shadow:0 24px 80px #0005}
    .mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border:1px solid #c6a76a;border-radius:16px;color:#e3c78e;font-weight:800;letter-spacing:.08em;margin-bottom:24px}
    .eyebrow{color:#e3c78e;text-transform:uppercase;letter-spacing:.22em;font-size:.75rem;font-weight:700}
    h1{font-size:clamp(2.6rem,8vw,5rem);line-height:1;margin:18px 0;letter-spacing:-.06em}
    p{color:#b8c2d3;line-height:1.7;font-size:1.05rem;max-width:520px;margin:0 auto}
    .rule{width:64px;height:2px;background:#c6a76a;margin:28px auto}
    small{display:block;color:#8c9ab0;margin-top:36px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">AYC</div>
    <div class="eyebrow">London</div>
    <h1>AYC London</h1>
    <div class="rule"></div>
    <p>A refined online presence for AYC London. This page is a temporary homepage while the full website files are restored.</p>
    <small>Website preview</small>
  </main>
</body>
</html>
